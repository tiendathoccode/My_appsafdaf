[main]
# Đồng bộ font chữ với Waybar, tăng kích thước để dễ đọc
font=JetBrainsMono Nerd Font:size=12
fuzzy=true
exit-on-keyboard-focus-loss=false

# Tùy chỉnh icon và kích thước bảng Fuzzel
icons-enabled=yes
prompt="❯ "
lines=7
width=35

# Thêm "không gian thở" (padding) để chữ không bị sát viền
horizontal-pad=15
vertical-pad=15
inner-pad=5

[border]
# Đồng bộ độ bo góc mượt mà và độ dày viền với Waybar/Hyprland
radius=16
width=2

[colors]
# Fuzzel sử dụng hệ màu rrggbbaa (6 ký tự hex + 2 ký tự độ mờ alpha)
# ff = đục 100%, f2 = mờ nhẹ (95%)

background=000000f2      # Nền đen hơi trong suốt để thấy mờ mờ hình nền phía sau
text=ffffffff            # Chữ trắng tinh
prompt=ffffffff          # Dấu mủi tên nhập liệu màu trắng
match=888888ff           # Ký tự gõ trùng khớp sẽ có màu xám

# HIỆU ỨNG ĐẢO MÀU (Cốt lõi của sự nổi bật)
selection=ffffffff       # Dòng đang chọn: Nền Trắng tinh
selection-text=000000ff  # Dòng đang chọn: Chữ Đen
selection-match=000000ff # Dòng đang chọn: Ký tự trùng khớp màu đen

border=ffffffff          # Viền trắng tinh rõ nét
